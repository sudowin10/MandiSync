name: MandiSync CI — Build, Test & Verify

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Job 1: Run Full Python Test Suite ───────────────────────────────────
  test-backend:
    name: Run 42 API Tests Against Live Atlas Cluster
    runs-on: ubuntu-latest

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB_NAME: mandisync_db
      MONGO_TIMEOUT_MS: 15000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend_api/requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Run full test suite
        run: python -m pytest tests/ -v --tb=short

  # ─── Job 2: Build Docker Image to Verify Dockerfile ─────────────────────
  build-docker:
    name: Build Docker Image (Smoke Test)
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t mandisync-backend:latest .
          echo "✅ Docker image built successfully"

      - name: Verify Docker image health
        run: |
          docker run -d \
            -p 8000:8000 \
            -e MONGO_URI="${{ secrets.MONGO_URI }}" \
            -e MONGO_DB_NAME=mandisync_db \
            --name mandisync_test \
            mandisync-backend:latest
          
          sleep 10
          
          curl --fail --retry 3 --retry-delay 5 http://localhost:8000/health
          echo "✅ Container health check passed"
          
          docker stop mandisync_test
