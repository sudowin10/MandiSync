# ==============================================================================
# MandiSync AI — Docker Compose Stack
# Runs the full backend with a single command: docker compose up --build
# ==============================================================================

version: '3.9'

services:

  # ── MandiSync FastAPI Backend ──────────────────────────────────────────────
  mandisync-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mandisync_backend
    restart: unless-stopped

    # Map host port 8000 to container port 8000
    ports:
      - "8000:8000"

    # Environment Variables — Copy this block into a .env file for production
    environment:
      - MONGO_URI=mongodb+srv://abhi20singhbhati_db_user:4D6ZmP790VgmSqgX@cluster0.sgu4gdt.mongodb.net/?retryWrites=true&w=majority
      - MONGO_DB_NAME=mandisync_db
      - ENVIRONMENT=production
      - LOG_LEVEL=info

    # Mount the trained ML model file into the container without rebuilding
    volumes:
      - ./ml_engine/models:/app/ml_engine/models:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 25s
      retries: 3

    # Resource limits (prevents RAM hogging on shared cloud VMs)
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

# ==============================================================================
# HOW TO USE:
#
#  BUILD & START:  docker compose up --build
#  START DETACHED: docker compose up -d
#  VIEW LOGS:      docker compose logs -f mandisync-backend
#  STOP:           docker compose down
#
#  SWAGGER DOCS:   http://localhost:8000/docs
#  TEST DASHBOARD: http://localhost:8000/app
# ==============================================================================
